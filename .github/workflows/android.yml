name: Build Android

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android NDK
        run: sdkmanager --install "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Check environment
        run: |
          echo "FONTCONFIG_NO_PKG_CONFIG=${FONTCONFIG_NO_PKG_CONFIG:-<not set>}"
          echo "PKG_CONFIG_ALLOW_CROSS=${PKG_CONFIG_ALLOW_CROSS:-<not set>}"
          which aarch64-linux-android24-clang
          aarch64-linux-android24-clang --version

      - name: Build Android ARM64
        env:
          CC_aarch64_linux_android: aarch64-linux-android24-clang
          CXX_aarch64_linux_android: aarch64-linux-android24-clang++
          PKG_CONFIG_ALLOW_CROSS: "1"
        run: |
          unset FONTCONFIG_NO_PKG_CONFIG
          unset RUST_FONTCONFIG_DLOPEN

          cargo clean

          cargo build --release \
            --target aarch64-linux-android

      - name: Rename binary
        run: |
          mv target/aarch64-linux-android/release/grail \
             target/aarch64-linux-android/release/grail-arm64-android

      - name: Verify binary
        run: |
          file target/aarch64-linux-android/release/grail-arm64-android
          ls -lh target/aarch64-linux-android/release/grail-arm64-android

      - name: Upload Android binary
        uses: actions/upload-artifact@v4
        with:
          name: grail-android-arm64
          path: target/aarch64-linux-android/release/grail-arm64-android
