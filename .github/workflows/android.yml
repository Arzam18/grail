name: Build Android Binary

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Grail for Android
        env:
          RUSTFLAGS: ""
          CARGO_ENCODED_RUSTFLAGS: ""
          CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS: ""
        run: |
          cargo ndk -t arm64-v8a --platform 24 build \
            --release \
            -p grail \
            --bin grail \
            --config 'build.rustflags=[]' \
            --config 'target.aarch64-linux-android.rustflags=[]'

          mkdir -p dist/bin
          cp target/aarch64-linux-android/release/grail dist/bin/grail-android-arm64

      - name: Verify Binary
        run: |
          ls -lh dist/bin/
          file dist/bin/*

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: grail-android-arm64
          path: dist/bin/grail-android-arm64
